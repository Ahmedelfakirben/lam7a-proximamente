  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C69F68;
      --gold-light: #E4C597;
      --gold-dark: #9A7544;
      --dark: #0F0D0C;
      --dark-card: rgba(22, 18, 15, 0.78);
      --cream: #FAF8F5;
      --muted: rgba(250, 248, 245, 0.65);
      --border-gold: rgba(198, 159, 104, 0.25);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark);
      color: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* =========================================================
       PRELOADER (PANTALLA DE CARGA ELEGANTE)
    ========================================================= */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0B0908;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.77, 0, 0.175, 1), visibility 0.8s ease;
    }

    #preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }

    /* Logo giratorio de carga con anillo de luz */
    .loader-logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(198, 159, 104, 0.15);
      border-top-color: var(--gold);
      border-right-color: rgba(228, 197, 151, 0.6);
      animation: spin-ring 1.4s linear infinite;
      box-shadow: 0 0 20px rgba(198, 159, 104, 0.2);
    }

    .loader-ring-outer {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px dashed rgba(198, 159, 104, 0.2);
      animation: spin-ring-reverse 8s linear infinite;
    }

    @keyframes spin-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-ring-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .loader-svg {
      width: 48px;
      height: auto;
      fill: var(--gold-light);
      filter: drop-shadow(0 0 12px rgba(198,159,104,0.5));
      animation: pulse-logo 2s ease-in-out infinite alternate;
    }

    @keyframes pulse-logo {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    .loader-brand {
      font-family: 'IBM Plex Serif', serif;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Barra de progreso elegante */
    .loader-bar-bg {
      width: 140px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
      border-radius: 999px;
      box-shadow: 0 0 10px var(--gold);
      animation: load-progress 1.8s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    @keyframes load-progress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    /* Background image & ambient animation */
    .bg-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: -5%;
      background-image: url('assets/lamha-coming-soon-bg.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.65) contrast(1.1);
      animation: breathe 28s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from { transform: scale(1.0); }
      to   { transform: scale(1.08); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at center, rgba(15, 13, 12, 0.75) 0%, rgba(10, 8, 7, 0.94) 100%);
    }

    /* Subtle luxury glowing light particles */
    .glow-orb {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(198,159,104,0.15) 0%, rgba(0,0,0,0) 70%);
      z-index: 2;
      pointer-events: none;
      animation: float-glow 15s ease-in-out infinite alternate;
    }

    .glow-orb-1 { top: -100px; left: -100px; }
    .glow-orb-2 { bottom: -120px; right: -120px; animation-delay: -7s; }

    @keyframes float-glow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 50px) scale(1.1); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* Language Switcher */
    .lang-drop {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 50;
      opacity: 0;
      animation: fadein 1s ease forwards 1.2s;
    }

    .lang-drop-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-gold);
      border-radius: 999px;
      color: rgba(250, 248, 245, 0.85);
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .lang-drop-btn:hover {
      background: rgba(198, 159, 104, 0.18);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 15px rgba(198, 159, 104, 0.2);
    }

    .lang-drop-btn i.globe { font-size: 0.8rem; color: var(--gold); }
    .lang-drop-btn .chevron { font-size: 0.6rem; opacity: 0.6; transition: transform 0.3s ease; }
    .lang-drop.open .chevron { transform: rotate(180deg); }

    .lang-drop-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(18, 14, 12, 0.95);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 6px;
      min-width: 160px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      animation: dropdown-open 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lang-drop.open .lang-drop-menu { display: block; }

    @keyframes dropdown-open {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lang-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 14px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: rgba(250, 248, 245, 0.75);
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .lang-option:hover {
      background: rgba(198, 159, 104, 0.15);
      color: var(--gold);
    }

    .lang-option.active {
      color: var(--gold);
      font-weight: 600;
      background: rgba(198, 159, 104, 0.1);
    }

    .lang-option .lang-code {
      font-size: 0.65rem;
      opacity: 0.5;
      letter-spacing: 0.08em;
    }

    /* Main Container Card */
    .main-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 54px 40px;
      max-width: 580px;
      width: 90%;
      margin: 40px auto;
      background: var(--dark-card);
      border: 1px solid var(--border-gold);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      animation: fadeup 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
    }

    /* SVG Logo */
    .logo-svg {
      width: 140px;
      height: auto;
      fill: var(--cream);
      filter: drop-shadow(0 0 24px rgba(198,159,104,0.3));
      margin-bottom: 28px;
      transition: transform 0.5s ease;
    }

    .logo-svg:hover {
      transform: scale(1.03);
    }

    /* Decorative Divider */
    .sep {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      width: 200px;
    }

    .sep-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .sep-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }

    /* Headings & Text */
    .label {
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--cream);
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    h1 em {
      font-style: italic;
      color: var(--gold-light);
      background: linear-gradient(135deg, #FAF8F5 30%, #C69F68 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      font-size: clamp(0.9rem, 1.8vw, 1.02rem);
      color: var(--muted);
      font-weight: 300;
      line-height: 1.75;
      max-width: 440px;
      margin-bottom: 36px;
    }

    /* Action Buttons (Instagram & WhatsApp) */
    .cta-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-ig {
      background: linear-gradient(135deg, rgba(198, 159, 104, 0.9), rgba(86, 64, 49, 0.9));
      color: #fff;
      border: 1px solid transparent;
      box-shadow: 0 4px 22px rgba(198, 159, 104, 0.35);
    }

    .btn-ig:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 30px rgba(198, 159, 104, 0.55);
    }

    .btn-wa {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-gold);
      color: var(--cream);
      backdrop-filter: blur(8px);
    }

    .btn-wa:hover {
      background: rgba(198, 159, 104, 0.15);
      border-color: var(--gold);
      transform: translateY(-2px);
      color: var(--gold-light);
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      margin-bottom: 24px;
      text-align: center;
      opacity: 0;
      animation: fadein 1s ease forwards 1.5s;
    }

    footer p {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: rgba(250, 248, 245, 0.35);
      text-transform: uppercase;
    }

    footer span { color: var(--gold); }

    /* RTL Support */
    .ar-text {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      direction: rtl;
    }

    /* Animations */
    @keyframes fadeup {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (max-width: 540px) {
      .main-card { padding: 40px 22px; }
      .cta-group { flex-direction: column; }
      .btn-action { width: 100%; }
    }
  </style>
</head>

  <script>
    // Control del Preloader elegante
    window.addEventListener('load', function() {
      setTimeout(function() {
        const preloader = document.getElementById('preloader');
        if (preloader) preloader.classList.add('loaded');
      }, 1000);
    });

    const T = {
      es: {
        label: "Haute Photographie d'Auteur • Tetuán",
        title: ['Sitio en ', 'construcción'],
        sub:   'Estamos preparando algo especial. Estaremos en línea muy pronto.<br>Mientras tanto, encuéntranos en Instagram o WhatsApp.',
        ig:    'Seguir en Instagram',
        wa:    'Contactar por WhatsApp',
        dir:   'ltr'
      },
      en: {
        label: "Haute Photographie d'Auteur • Tetuán",
        title: ['Site under ', 'construction'],
        sub:   'We are preparing something special. We will be online very soon.<br>In the meantime, find us on Instagram or WhatsApp.',
        ig:    'Follow on Instagram',
        wa:    'Contact on WhatsApp',
        dir:   'ltr'
      },
      fr: {
        label: "Haute Photographie d'Auteur • Tétouan",
        title: ['Site en ', 'construction'],
        sub:   'Nous préparons quelque chose de spécial. Bientôt en ligne.<br>En attendant, retrouvez-nous sur Instagram ou WhatsApp.',
        ig:    'Suivre sur Instagram',
        wa:    'Contacter sur WhatsApp',
        dir:   'ltr'
      },
      ar: {
        label: 'هوت فوتوغرافي • تطوان',
        title: ['الموقع قيد ', 'الإنشاء'],
        sub:   'نحن نحضّر شيئاً مميزاً. سنكون متاحين قريباً.<br>في غضون ذلك، تجدوننا على إنستغرام أو واتساب.',
        ig:    'تابعونا على إنستغرام',
        wa:    'تواصل عبر واتساب',
        dir:   'rtl'
      }
    };

    let currentLangKey = 'es';

    function toggleLangDrop() {
      document.getElementById('langDrop').classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      const drop = document.getElementById('langDrop');
      if (drop && !drop.contains(e.target)) drop.classList.remove('open');
    });

    function selectLang(lang, code, name) {
      currentLangKey = lang;
      setLang(lang);
      document.getElementById('currentLang').textContent = code;
      document.getElementById('langDrop').classList.remove('open');
      ['es','en','fr','ar'].forEach(l => {
        const el = document.getElementById('btn-'+l);
        if (el) el.classList.toggle('active', l === lang);
      });
    }

    function setLang(lang) {
      const d = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir  = d.dir;

      document.getElementById('cs-label').textContent = d.label;
      const h1 = document.getElementById('cs-title');
      h1.innerHTML = d.title[0] + '<em>' + d.title[1] + '</em>';

      if (d.dir === 'rtl') {
        h1.classList.add('ar-text');
        document.querySelector('.main-card').classList.add('ar-text');
      } else {
        h1.classList.remove('ar-text');
        document.querySelector('.main-card').classList.remove('ar-text');
      }

      document.getElementById('cs-sub').innerHTML = d.sub;
      document.getElementById('cs-ig-text').textContent = d.ig;
      document.getElementById('cs-wa-text').textContent = d.wa;
    }

    // Auto-detect browser language
    (function() {
      const codes = { es:'ES', en:'EN', fr:'FR', ar:'AR' };
      const names = { es:'Español', en:'English', fr:'Français', ar:'العربية' };
      const nav = (navigator.language || 'es').toLowerCase().slice(0,2);
      const lang = ['es','en','fr','ar'].includes(nav) ? nav : 'es';
      selectLang(lang, codes[lang], names[lang]);
    })();
  </script>
</body>
</html>
